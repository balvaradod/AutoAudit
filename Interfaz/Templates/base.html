<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>AutoAudit</title>
<style>
  body { font-family: Arial, sans-serif; margin: 0; background: #f4f6f9; color: #222; }
  header { background: #1f3a5f; color: white; padding: 10px 24px; display: flex; align-items: center; gap: 24px; }
  header h1 { font-size: 20px; margin: 0; }
  header a { color: #dce6f5; text-decoration: none; }
  header a:hover { text-decoration: underline; }
  header .derecha { margin-left: auto; font-size: 14px; }
  main { max-width: 1100px; margin: 20px auto; padding: 0 16px; }
  .caja { background: white; border: 1px solid #ccd; border-radius: 6px; padding: 16px; margin-bottom: 16px; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th, td { border: 1px solid #bbb; padding: 4px 8px; text-align: left; }
  th { background: #e4e9f1; }
  label { display: inline-block; margin: 6px 12px 6px 0; }
  input[type=text], input[type=password], input[type=datetime-local], select { padding: 4px; }
  button, .boton { background: #1f3a5f; color: white; border: 0; padding: 7px 14px; border-radius: 4px; cursor: pointer; text-decoration: none; font-size: 14px; }
  button.rojo { background: #a33; }
  .ok { background: #dff0d8; border: 1px solid #9c9; padding: 8px; margin-bottom: 10px; }
  .error { background: #f8d7da; border: 1px solid #c88; padding: 8px; margin-bottom: 10px; }
  pre { background: #f0f0f0; border: 1px solid #ccc; padding: 8px; overflow-x: auto; font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>AutoAudit</h1>
  {% if session.usuario %}
  <a href="{{ url_for('configurar') }}">Configurar auditoría</a>
  <a href="{{ url_for('configuracion') }}">Configuración actual</a>
  <a href="{{ url_for('historial') }}">Historial</a>
  <span class="derecha">Usuario: {{ session.usuario }} | <a href="{{ url_for('logout') }}">Salir</a></span>
  {% endif %}
</header>
<main>
  {% for categoria, texto in get_flashed_messages(with_categories=true) %}
    <div class="{{ categoria }}">{{ texto }}</div>
  {% endfor %}
  {% block contenido %}{% endblock %}
</main>
</body>
</html>
